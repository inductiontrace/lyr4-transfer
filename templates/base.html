<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}transfer.lyr4.net{% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="/static/icon-512.png" sizes="512x512">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#111113">
  <meta property="og:site_name" content="transfer.lyr4.net">
  <meta property="og:title" content="transfer.lyr4.net">
  <meta property="og:description" content="Encrypted file transfer.">
  <meta property="og:image" content="https://transfer.lyr4.net/static/og.jpg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --page: #111113;
      --bg: #0d0d0f;
      --surface: #141418;
      --border: #1e1e24;
      --accent: #3a7bfd;
      --accent-dim: #1e3a80;
      --text: #d4d4d8;
      --text-dim: #71717a;
      --success: #22c55e;
      --error: #ef4444;
      --radius: 8px;
      --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    html, body {
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    /* The image's edges are --page, so it ends without a line; at least 1100px wide
       and anchored top-right, so a phone shows the globe rather than empty sky */
    body {
      background: var(--page) url('/static/page-bg.jpg') no-repeat right top / max(100%, 1100px) auto;
    }

    /* A semi-opaque panel keeps the background from competing with the content */
    .container {
      max-width: 640px;
      margin: 2.5rem auto 3rem;
      padding: 2rem 2rem 1.5rem;
      background: rgba(17, 17, 19, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .page-head + .container { margin-top: 0; }

    @media (max-width: 700px) {
      .container { margin: 1rem; padding: 2rem 1.25rem 1.25rem; }
    }

    .site-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(17, 17, 19, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .site-header-inner {
      max-width: 820px;
      margin: 0 auto;
      height: 4rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .wordmark {
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .wordmark span { color: var(--accent); }

    .site-header svg { flex-shrink: 0; }

    @media (max-width: 700px) {
      .site-header-inner { margin: 0 1rem; }
      .wordmark { font-size: 0.85rem; }
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* Page title and subtitle: wider than the panel and aligned with the header */
    .page-head {
      max-width: 820px;
      margin: 2.75rem auto 1.75rem;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.7);
    }
    .page-head h1 { font-size: 2rem; letter-spacing: -0.01em; }
    .page-head .subtitle { font-size: 1rem; margin-bottom: 0; }

    /* Narrow screens put the globe behind the page text, so dim it there */
    @media (max-width: 700px) {
      .page-head { margin: 1.75rem 1rem 1.25rem; }
      .page-head h1 { font-size: 1.5rem; }
      body {
        background-image: linear-gradient(rgba(17, 17, 19, 0.55), rgba(17, 17, 19, 0.55)), url('/static/page-bg.jpg');
        background-size: auto, 1100px auto;
        background-position: 0 0, right top;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    input[type="text"], input[type="password"], input[type="file"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.9rem;
      padding: 0.6rem 0.85rem;
      margin-bottom: 1.25rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--accent); }

    input[type="file"] {
      font-family: inherit;
      cursor: pointer;
      padding: 0.5rem 0.85rem;
    }

    button, .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.65rem 1.5rem;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    button:hover, .btn:hover { opacity: 0.85; }

    .error-box {
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: var(--radius);
      color: var(--error);
      font-size: 0.875rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-dim);
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
    }

    .meta-row:last-child { border-bottom: none; }
    .meta-row strong { color: var(--text); font-weight: 500; }

    .copy-box {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.65rem 0.85rem;
      margin: 1.5rem 0;
    }

    .copy-box code {
      flex: 1;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
      word-break: break-all;
    }

    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.75rem;
      padding: 0.3rem 0.7rem;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: var(--mono);
      text-align: center;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="wordmark" href="/upload"><span>transfer</span>.lyr4.net</a>
      <svg width="26" height="28" viewBox="0 0 26 28" aria-hidden="true">
        <g stroke="#d9a35b" stroke-width="0.8" fill="none" opacity="0.85">
          <path d="M22 3 L16 8.5 M16 8.5 L8 11 L4 24 L14 20.5 Z"/>
        </g>
        <g fill="#f3c27a">
          <path d="M22 0.8 L22.7 2.3 L24.2 3 L22.7 3.7 L22 5.2 L21.3 3.7 L19.8 3 L21.3 2.3 Z"/>
          <circle cx="16" cy="8.5" r="1.3"/><circle cx="8" cy="11" r="1.1"/>
          <circle cx="4" cy="24" r="1.2"/><circle cx="14" cy="20.5" r="1.1"/>
        </g>
        <circle cx="9" cy="22.2" r="0.9" fill="#8fd6d0"/>
      </svg>
      <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true">
        <path d="M3.5 8 V5.5 a3.5 3.5 0 0 1 7 0 V8" stroke="#8a8a93" stroke-width="1.8" fill="none"/>
        <rect x="1" y="8" width="12" height="9.5" rx="2" fill="#8a8a93"/>
        <circle cx="7" cy="12.2" r="1.4" fill="#111113"/>
        <rect x="6.3" y="12.6" width="1.4" height="2.6" rx="0.6" fill="#111113"/>
      </svg>
    </div>
  </header>
  {% if self.page_head() | trim %}<div class="page-head">{% block page_head %}{% endblock %}</div>{% endif %}
  <div class="container">
    {% block content %}{% endblock %}
    <div class="footer">lyr4.net // secure file relay</div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
